<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organiza tu itinerario | The House of Tours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css?v=11">
</head>
<body data-titulo="titulo_form">
  <header class="barra">
    <div class="marca">
      <svg class="brujula" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M20 5 L25 20 L15 20 Z" fill="#5FAF84"/>
        <path d="M20 35 L25 20 L15 20 Z" fill="currentColor"/>
      </svg>
      <span>The House of Tours</span>
      <label class="selector-idioma">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <select id="selectorIdioma"></select>
      </label>
    </div>
  </header>

  <main class="pagina">
    <!-- ================= FORMULARIO ================= -->
    <section id="vistaFormulario">
      <h1 data-i18n="f_titulo">Organiza un itinerario a tu medida</h1>
      <p class="intro" data-i18n="f_intro"></p>
      <p id="errorCarga" class="aviso" hidden></p>

      <form id="formulario" novalidate>
        <fieldset>
          <legend data-i18n="f_fechas">Fechas</legend>
          <div class="fila">
            <label><span data-i18n="f_desde">Desde</span> <input id="fechaInicio" type="date" required></label>
            <label><span data-i18n="f_hasta">Hasta</span> <input id="fechaFin" type="date" required></label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="f_servicios">Actividades por día</legend>
          <p id="ayudaDias" class="ayuda"></p>
          <div id="dias" class="dias"></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="f_hospedaje">Hospedaje</legend>
          <div class="fila">
            <label><span data-i18n="f_donde">¿Dónde te hospedas?</span>
              <select id="propiedad" required></select>
            </label>
            <label id="campoOtro" hidden><span data-i18n="f_nombre_lugar">Nombre del lugar</span>
              <input id="propiedadOtro" type="text" data-i18n-placeholder="f_ph_lugar">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="f_datos">Tus datos</legend>
          <div class="fila">
            <label><span data-i18n="f_nombre">Nombre</span> <input id="nombre" type="text" autocomplete="given-name" required></label>
            <label><span data-i18n="f_apellido">Apellido</span> <input id="apellido" type="text" autocomplete="family-name" required></label>
          </div>
          <div class="fila">
            <label><span data-i18n="f_correo">Correo electrónico</span> <input id="correo" type="email" autocomplete="email" required></label>
            <div class="telefono">
              <label><span data-i18n="f_codigo">Código</span>
                <select id="codigoPais" autocomplete="tel-country-code"></select>
              </label>
              <label><span data-i18n="f_telefono">Teléfono</span> <input id="telefono" type="tel" autocomplete="tel-national" required></label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="f_personas">¿Cuántas personas?</legend>
          <div class="fila tres">
            <label><span data-i18n="f_adultos">Adultos</span> <span class="nota" data-i18n="f_nota_adultos"></span>
              <input id="adultos" type="number" min="1" max="99" value="2" inputmode="numeric">
            </label>
            <label><span data-i18n="f_ninos">Niños</span> <span class="nota" data-i18n="f_nota_ninos"></span>
              <input id="ninos" type="number" min="0" max="99" value="0" inputmode="numeric">
            </label>
            <label><span data-i18n="f_menores">Menores</span> <span class="nota" data-i18n="f_nota_menores"></span>
              <input id="menores" type="number" min="0" max="99" value="0" inputmode="numeric">
            </label>
          </div>
          <p id="totalPersonas" class="total-personas"></p>
        </fieldset>

        <div id="errores" class="aviso" role="alert" hidden></div>
        <button id="btnEnviar" type="submit" class="btn primario grande" data-i18n="f_enviar">Enviar solicitud</button>
      </form>
    </section>

    <!-- ================= CONFIRMACIÓN ================= -->
    <section id="vistaGracias" hidden>
      <div class="boleta">
        <div class="boleta-cabeza">
          <p class="boleta-marca">The House of Tours</p>
          <p class="boleta-etiqueta" data-i18n="g_etiqueta">Tu número de cotización</p>
          <p id="numeroFinal" class="numero-grande" tabindex="-1"></p>
        </div>
        <p id="textoGracias"></p>
        <div id="resumenFinal"></div>
        <div class="acciones">
          <button type="button" class="btn" id="btnImprimir" data-i18n="g_imprimir">Imprimir</button>
          <button type="button" class="btn" id="btnNueva" data-i18n="g_otra">Hacer otra solicitud</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= SELECTOR DE ACTIVIDADES ================= -->
  <dialog id="selector" class="selector" aria-labelledby="selTitulo">
    <div class="sel-cabeza">
      <div>
        <p id="selDia" class="sel-dia"></p>
        <h2 id="selTitulo" data-i18n="s_titulo">Elige tus actividades</h2>
      </div>
      <button type="button" id="selCerrar" class="sel-cerrar" data-i18n-aria="s_cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sel-filtros">
      <input id="selBuscar" type="search" data-i18n-placeholder="s_buscar" data-i18n-aria="s_buscar" autocomplete="off">
      <div id="selTipos" class="sel-tipos" role="group" data-i18n-aria="s_tipos"></div>
    </div>
    <div id="selLista" class="sel-lista"></div>
    <div class="sel-pie">
      <p id="selCuenta" class="sel-cuenta" aria-live="polite"></p>
      <button type="button" id="selListo" class="btn primario" data-i18n="s_listo">Listo</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=11"></script>
  <script src="i18n.js?v=11"></script>
  <script src="formulario.js?v=11"></script>
</body>
</html>
