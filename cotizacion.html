<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu cotización | The House of Tours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css?v=15">
  <style>
    .dia-bloque { margin-top: 22px; }
    .dia-titulo { font-family: var(--titulos); font-weight: 700; font-size: 1.1rem; margin: 0 0 8px; }
    .act { background: var(--blanco); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--verde); }
    .act-cab { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .act-nombre { font-weight: 700; margin: 0; }
    .act-hora { color: var(--gris); margin: 2px 0 6px; }
    .act-lugar, .act-part { font-size: .92rem; color: var(--gris); margin: 2px 0; }
    .monto { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
    .caja-total { background: var(--blanco); border-radius: 12px; padding: 18px 20px; margin-top: 24px; display: grid; gap: 6px; }
    .caja-total p { display: flex; justify-content: space-between; margin: 0; font-variant-numeric: tabular-nums; }
    .caja-total .grande strong { font-family: var(--titulos); font-size: 2rem; color: var(--verde-hondo); }
    .caja { background: var(--blanco); border-radius: 12px; padding: 20px; margin-top: 20px; }
    .caja h2 { font-family: var(--titulos); font-size: 1.25rem; margin: 0 0 10px; }
    .check { display: flex; flex-direction: row; align-items: center; gap: 12px; font-weight: 700; font-size: 1.05rem; margin: 12px 0 16px; cursor: pointer; }
    .check input { width: 24px; height: 24px; accent-color: var(--verde); flex: none; padding: 0; }
    textarea { font: inherit; width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 8px; margin-bottom: 12px; }
    .exito { background: var(--verde-suave); color: var(--verde-hondo); border-radius: 12px; padding: 18px 20px; margin-top: 20px; font-weight: 500; }
    .exito strong { font-family: var(--titulos); font-size: 1.3rem; display: block; margin-bottom: 4px; }
    .pregunta { background: var(--fondo); border-radius: 8px; padding: 10px 14px; margin-top: 10px; border: 2px solid transparent; }
    .pregunta.falta { border-color: var(--amarillo, #D9A21B); background: #FFFCF3; }
    .pregunta-texto { margin: 0 0 6px; font-weight: 700; }
    .opcion { display: flex; flex-direction: row; align-items: center; gap: 10px; font-weight: 500; margin: 4px 0; cursor: pointer; }
    .opcion input { width: 20px; height: 20px; accent-color: var(--verde); flex: none; padding: 0; }
    .pregunta-lugares { margin-top: 6px; }
    .check input:disabled + * { opacity: .5; }
    @media print { .caja, .acciones { display: none !important; } .act { border: 1px solid #ccc; } }

    /* Preguntas del agente */
    .pregunta-agente { background: var(--fondo); border-radius: 8px; padding: 12px 14px; margin-top: 12px; border: 2px solid transparent; }
    .pregunta-agente.falta { border-color: var(--amarillo, #D9A21B); background: #FFFCF3; }
    .pregunta-agente .ayuda { margin: 0 0 4px; }
    .pregunta-agente textarea { min-height: 80px; margin: 6px 0 10px; background: #fff; }
    .respuesta-cliente { margin: 6px 0 0; }

    /* Mis vouchers */
    .vouchers h2 { margin-bottom: 4px; }
    .vch-botones { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .vch-lista { display: grid; gap: 14px; margin-top: 14px; }
    .vch-dia { font-family: var(--titulos); font-weight: 700; margin: 8px 0 -4px; }
    .vch { border: 1px solid var(--linea); border-radius: 12px; padding: 16px 18px; background: #fff; color: #1d2a24; break-inside: avoid; }
    .vch-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid var(--verde); padding-bottom: 10px; }
    .vch-logo { max-height: 52px; max-width: 180px; object-fit: contain; }
    .vch-marca { display: inline-flex; align-items: center; gap: 8px; font-family: var(--titulos); font-weight: 700; font-size: 1.05rem; color: var(--verde-hondo); }
    .vch-marca svg { width: 30px; height: 30px; }
    .vch-titulo { text-align: right; }
    .vch-titulo p { margin: 0; font-size: .85rem; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; }
    .vch-titulo .vch-codigo { display: grid; text-transform: none; letter-spacing: 0; margin-top: 4px; }
    .vch-codigo strong { font-family: var(--titulos); font-size: 1.3rem; color: #1d2a24; font-variant-numeric: tabular-nums; }
    .vch-servicio { font-family: var(--titulos); font-size: 1.2rem; margin: 12px 0 8px; }
    .vch-datos { display: grid; gap: 6px 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin: 0; }
    .vch-fila { display: grid; gap: 1px; }
    .vch-fila dt { font-size: .78rem; color: var(--gris); text-transform: uppercase; letter-spacing: .03em; }
    .vch-fila dd { margin: 0; font-weight: 500; }
    .vch-fila.ancha { grid-column: 1 / -1; }
    .vch-es { text-transform: none; letter-spacing: 0; opacity: .75; }
    .vch-pago { margin: 12px 0 0; font-size: .9rem; }
    .vch-pagado { color: var(--verde-hondo); font-weight: 700; }
    .vch-saldo { color: var(--gris); font-style: italic; }
    .vch-pie { margin: 12px 0 0; padding-top: 8px; border-top: 1px solid var(--linea); font-size: .75rem; color: var(--gris); }
    @media (max-width: 520px) { .vch-titulo { text-align: left; } .vch { padding: 14px; } }

    @page { size: letter; margin: 12mm; }
    @media print {
      body.imp-vouchers .barra, body.imp-compacto .barra,
      body.imp-vouchers #contenido > :not(#vouchers), body.imp-compacto #contenido > :not(#vouchers),
      body.imp-vouchers .vouchers > :not(.vch-lista), body.imp-compacto .vouchers > :not(.vch-lista) { display: none !important; }
      body.imp-vouchers .vouchers, body.imp-compacto .vouchers { display: block !important; padding: 0; margin: 0; background: none; }
      body.imp-vouchers .pagina, body.imp-compacto .pagina { padding: 0; margin: 0; max-width: none; }
      body { background: #fff !important; }
      .vch { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      /* Un tiquete por hoja */
      body.imp-vouchers .vch-dia { display: none; }
      body.imp-vouchers .vch-lista { display: block; }
      body.imp-vouchers .vch { break-after: page; page-break-after: always; border: 1px solid #bbb; padding: 22px 26px; font-size: 1.05rem; }
      body.imp-vouchers .vch:last-child { break-after: auto; page-break-after: auto; }

      /* Itinerario compacto: tantos como quepan, por día y hora, separados por líneas de puntos */
      body.imp-compacto .vch-lista { display: block; }
      body.imp-compacto .vch-dia { margin: 8px 0 2px; font-size: .9rem; }
      body.imp-compacto .vch { border: 0; border-radius: 0; border-bottom: 2px dotted #777; padding: 7px 0 9px; font-size: .78rem; }
      body.imp-compacto .vch-cab { border-bottom-width: 1px; padding-bottom: 4px; }
      body.imp-compacto .vch-logo { max-height: 26px; }
      body.imp-compacto .vch-marca { font-size: .85rem; }
      body.imp-compacto .vch-marca svg { width: 18px; height: 18px; }
      body.imp-compacto .vch-titulo p { font-size: .68rem; }
      body.imp-compacto .vch-codigo strong { font-size: .95rem; }
      body.imp-compacto .vch-servicio { font-size: .95rem; margin: 4px 0 3px; }
      body.imp-compacto .vch-datos { grid-template-columns: repeat(4, 1fr); gap: 2px 10px; }
      body.imp-compacto .vch-fila dt { font-size: .62rem; }
      body.imp-compacto .vch-pago { margin-top: 3px; font-size: .72rem; }
      body.imp-compacto .vch-pie { margin-top: 3px; padding-top: 2px; font-size: .62rem; border-top: 0; }
    }
  </style>
</head>
<body data-titulo="titulo_cot">
  <header class="barra">
    <div class="marca">
      <svg class="brujula" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M20 5 L25 20 L15 20 Z" fill="#5FAF84"/>
        <path d="M20 35 L25 20 L15 20 Z" fill="currentColor"/>
      </svg>
      <span>The House of Tours</span>
      <label class="selector-idioma">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <select id="selectorIdioma"></select>
      </label>
    </div>
  </header>

  <main class="pagina">
    <p id="cargando" class="ayuda" data-i18n="c_cargando">Cargando tu cotización…</p>
    <p id="error" class="aviso" hidden></p>
    <div id="contenido" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=13"></script>
  <script src="i18n.js?v=16"></script>
  <script src="cotizacion.js?v=16"></script>
</body>
</html>
